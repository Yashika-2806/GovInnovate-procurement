[project]
name = "pitch-evaluator"
version = "0.1.0"
description = "Pitch Evaluator Agent for GovInnovate Procurement"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "pdfplumber>=0.11",
    "python-pptx>=1.0",
    "fastapi>=0.110",
    "httpx>=0.27",
    "uvicorn>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]
# Optional: faster-whisper for production STT
stt = [
    "faster-whisper>=1.0",
]
# Optional: openai client for LLM-based evidence extraction (OpenAI-compatible APIs)
llm = [
    "openai>=1.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true